<!doctype html><html lang="en"><meta charset="utf-8"><title>Studio preview</title><style>body{font:18px system-ui;background:#f3f1e9;padding:65px}button{padding:18px}article{width:400px;padding:28px;background:white;border-radius:16px}h1{font-size:45px}</style><article><small>ACME / WORKSPACE</small><h1 id="hero">Make room for better ideas.</h1><p>Bring the whole team into the conversation.</p><button id="cta" onclick="this.textContent='ACTIVATED'">Start a project</button></article><script>
window.chrome={runtime:{id:'preview-only',sendMessage:async m=>{if(m.type==='screenshot:capture')return{ok:false,error:'Screenshot capture requires the installed extension.'};const key=m.type.startsWith('draft:')?'draft:'+m.url:'backlog:'+m.data?.id;let data;if(m.type==='draft:get')data=JSON.parse(localStorage.getItem(key)||'null');if(m.type==='draft:put'||m.type==='backlog:save')localStorage.setItem(key,JSON.stringify({...m.data,updatedAt:new Date().toISOString()}));if(m.type==='backlog:list')data=Object.keys(localStorage).filter(k=>k.startsWith('backlog:')).map(k=>JSON.parse(localStorage.getItem(k)));if(m.type==='backlog:delete')localStorage.remove('backlog:'+m.id);return{ok:true,data};}}};
</script><script src="../core.js"></script><script src="../lifecycle.js"></script><script src="../content.js"></script>
