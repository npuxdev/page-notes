name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run unit tests
        run: node --test tests/unit.cjs
      - name: Build distributable
        run: node scripts/build.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: page-notes
          path: dist/page-notes-*.zip
